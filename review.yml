specDefects:
- spec: openapi/eia-api-v2-openapi.yml
  issue: |
    Stale. info.version declares 2.1.0 and the file inside the zip is dated
    2022-11-30 (HTTP Last-Modified 2022-12-01), while EIA's own patch notes put the
    running API at 2.1.12 as of March 2026. The documentation asserts "The YAML file
    will now automatically reflect any additions/changes to the API" — the published
    artifact does not bear that out. Routes added since 2022 (including the RTO
    sub-balancing-authority data points noted in the v2.1.6 entry) may be missing.
- spec: openapi/eia-api-v2-openapi.yml
  issue: |
    Distributed only as a ZIP archive at a hand-written path
    (https://www.eia.gov/opendata/eia-api-swagger.zip), not served at a conventional
    discoverable location. /openapi.json, /swagger.json, /api-docs, /.well-known/*
    all return 404 or the gateway's API_KEY_MISSING. A machine cannot find this
    contract without scraping the HTML of the Open Data landing page.
- spec: openapi/eia-api-v2-openapi.yml
  issue: |
    Heavily parameterised paths. Whole product families collapse to
    /v2/aeo/{route1} and /v2/ieo/{route1}, so the real dataset routes are not
    enumerable from the contract — they are discoverable only by walking the live
    API's metadata tree.
- spec: openapi/eia-api-v2-openapi.yml
  issue: |
    Tag distribution is lopsided and undescriptive as a product map: COAL 67
    operations and DBF (densified biomass) 41 against NG (natural gas) 7 and INTL 5,
    despite natural gas and international being far larger data estates. The spec
    covers the routes unevenly relative to the data behind them.
- spec: openapi/eia-api-v2-openapi.yml
  issue: |
    The API key is declared only as a query parameter, which is what EIA documents,
    but it means every request carries the credential in the URL and therefore into
    server logs, proxies, and browser history. No header alternative is offered.
