aid: eia
name: EIA
review:
  question: >-
    Does the U.S. Energy Information Administration publish a real, documented,
    publicly accessible API — and does any consumer energy data mandate apply to
    or originate from it?
  answer: true
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: United States
  tier: regulator
findings:
  summary: |
    EIA publishes the strongest public API in this entire energy series. The Open
    Data APIv2 at https://api.eia.gov/v2 is a genuine, fully RESTful, hierarchically
    self-documenting API over more than two million energy time series, described by
    a real, downloadable OpenAPI 3.0.0 document (225 paths, 278 operations, 16 tags)
    that EIA itself publishes as a zip at
    https://www.eia.gov/opendata/eia-api-swagger.zip. Access is free and self-serve:
    complete a short form at https://www.eia.gov/opendata/register.php and the key
    arrives by email automatically. A second surface, the Bulk Download Facility at
    https://api.eia.gov/bulk, needs no key at all — the manifest and every dataset
    zip are retrievable anonymously.

    EIA publishes NO consumer energy data API. There is no Green Button, no ESPI, no
    Download My Data, no Connect My Data, no consent or authorization flow, and no
    customer usage or billing endpoint anywhere in its surface. This is structural,
    not an omission: EIA never holds individual customer data. Its statutory surveys
    collect data from utilities, producers, and plants in already-aggregated form,
    and respondent-level data is further protected by confidentiality provisions.
    Retail customer usage data sits with the utilities and their state public utility
    commissions, not with a federal statistical agency.

    The consequence is the sharpest instance yet of this series' recurring finding: a
    federal data agency with no operating role publishes a better documented, better
    contracted, more openly accessible API than the investor-owned utilities whose
    numbers it reports.
mandateAndAccess:
  homeMarket: United States
  mandateRegime: other
  mandateRegimeVerbatim: |
    NO consumer energy data mandate applies to EIA. Explicitly: not cdr-energy (that
    is Australian statute), not green-button-ontario (that is an Ontario Energy Board
    regulation), not green-button-voluntary (EIA has neither adopted nor referenced
    Green Button / ESPI anywhere — https://www.eia.gov/search/?q=green%20button
    returned HTTP 404 and no Green Button or ESPI reference appears in the Open Data
    portal, the technical documentation, or the published OpenAPI), and not
    smart-meter-infrastructure (EIA operates no metering infrastructure and is not a
    DCC-equivalent).

    Two DIFFERENT obligations do genuinely apply to EIA, and neither is a consumer
    data right:

    (1) EIA's own collection mandate, running OUTWARD to the industry. Under the
    Federal Energy Administration Act of 1974 and the Department of Energy
    Organization Act of 1977, EIA compels energy companies to report through
    mandatory survey forms — EIA-860 (generator inventory), EIA-861 (electric power
    sales, revenue, customers), EIA-923 (power plant operations), EIA-176 (natural
    gas), EIA-914 (oil and gas production), EIA-930 (hourly electric system
    operating data), and dozens more, catalogued at https://www.eia.gov/survey/
    (HTTP 200). Every route in APIv2 is a publication of data collected under this
    mandate. It is an obligation on the industry to REPORT, not an obligation on
    anyone to expose an API to consumers.

    (2) Federal open-data obligations running INWARD to EIA. The OPEN Government
    Data Act (Title II of the Foundations for Evidence-Based Policymaking Act of
    2018) and the preceding OMB Open Data Policy require federal agencies to publish
    their data as open, machine-readable, and catalogued by default. This is the
    obligation that the Open Data API and the bulk manifest actually discharge.
  mandateStatus: live-implemented
  mandateStatusEvidence: |
    Verified against live endpoints, not press releases or compliance pages:

    - GET https://api.eia.gov/v2/ (no key) returned HTTP 403 with the JSON body
      {"error":{"code":"API_KEY_MISSING","message":"No api_key was supplied.  Please
      register for one at https://www.eia.gov/opendata/register.php"}} — a live,
      key-gated production API, not a landing page.
    - GET https://api.eia.gov/v2/electricity/retail-sales?api_key=<40-char bogus key>
      returned HTTP 403 with {"error":{"code":"API_KEY_INVALID",...}} — key
      validation is real, so the gate is genuinely enforced.
    - GET https://www.eia.gov/opendata/eia-api-swagger.zip returned HTTP 200,
      6,702 bytes, Content-Type application/x-zip-compressed, Last-Modified
      Thu, 01 Dec 2022 19:29:35 GMT. It contains eia-api-swagger.yaml (149,215
      bytes), which parses as OpenAPI 3.0.0 with servers[0].url =
      https://api.eia.gov, 225 paths, 278 operations, and 16 tags. Harvested
      verbatim to openapi/eia-api-v2-openapi.yml.
    - GET https://api.eia.gov/bulk/manifest.txt returned HTTP 200 ANONYMOUSLY —
      a Project Open Data style JSON catalog with identifier, title, description,
      keyword, publisher, person, mbox, accessLevel, accessURL, and last_updated
      fields per dataset.
    - GET https://api.eia.gov/bulk/ELEC.zip returned HTTP 200 with Content-Length
      291,920,911 and Content-Type application/x-zip-compressed, again with no key.
    - GET https://www.energy.gov/data.json returned HTTP 200, 873,897 bytes, parsing
      to 483 datasets, of which 342 carry publisher "U.S. Energy Information
      Administration" — the DOE Project Open Data catalog entry that evidences the
      OPEN Government Data Act obligation being discharged in machine-readable form.
    - GET https://www.eia.gov/opendata/register.php returned HTTP 200 and serves the
      actual registration form (First Name, Last Name, Email, organization category,
      reason for use) with EIA's API Terms of Service inline. Its own wording: "Your
      API key will be sent to your email address" and "An API key is not required to
      use the bulk download facility."

    NOTHING here was taken on trust. The mandate that IS live-implemented is EIA's
    open-data publication obligation and the survey collection behind it — NOT a
    consumer data right, which does not exist here at all.
  consumerDataApi: false
  consumerDataEvidence: |
    Absent, and probed for. There is no Green Button, no ESPI resource tree, no
    Download My Data, no Connect My Data, no OAuth authorization or consent flow, no
    accredited-recipient register, and no customer-level usage or billing endpoint
    anywhere in EIA's surface.

    Probed and found absent:
    - The harvested OpenAPI (225 paths) contains no customer, consumer, account,
      meter-point, or consent route. Every path is a statistical route family:
      /v2/electricity/*, /v2/natural-gas/*, /v2/petroleum/*, /v2/coal/*,
      /v2/nuclear-outages/*, /v2/co2-emissions/*, /v2/international/*, /v2/seds/*,
      /v2/aeo/*, /v2/ieo/*, /v2/steo/*, /v2/total-energy/*, /v2/densified-biomass/*,
      /v2/crude-oil-imports/*, /v2/state-electricity-profiles/*.
    - securitySchemes declares exactly one scheme, api_key in query. There is no
      OAuth2 flow, no scopes object, no authorizationUrl, no tokenUrl — the shape a
      consumer-consent API would necessarily have.
    - https://api.eia.gov/.well-known/openid-configuration returned HTTP 403 with the
      same API_KEY_MISSING JSON body (the gateway intercepts every path), and
      https://www.eia.gov/.well-known/openid-configuration returned HTTP 404. No OIDC
      discovery document is served on either host.
    - EIA's smallest published electricity unit is state-by-sector (EIA-861) or
      plant-level (EIA-923) or balancing-authority-hourly (EIA-930). Nothing is
      per-premises, per-meter, or per-customer, and by statute it cannot be.
  marketDataOpen: true
  marketDataEvidence: |
    Wide open, and the best in this sector. EIA publishes genuinely open grid,
    market, and system data anonymously in bulk and behind a free instant key through
    the API:
    - Hourly U.S. Electric System Operating Data under /v2/electricity/rto — demand,
      demand forecast, net generation, generation by energy source, and interchange
      between balancing authorities and sub-balancing-authorities. The Hourly
      Electric Grid Monitor (https://www.eia.gov/electricity/gridmonitor/, HTTP 200)
      is a web tool over these same routes; the bulk equivalent is "U.S. Electric
      System Operating Data (2019-present)" at 661,461 series.
    - Wholesale and spot prices, retail price/revenue/sales/customers by state and
      sector, generator capacity, plant fuel receipts and costs, natural gas storage
      and pipeline flows, weekly petroleum status, coal mine-level production, daily
      nuclear outages pulled from NRC, CO2 emissions, international statistics, and
      the AEO / IEO / STEO projection models.
    - Bulk datasets by size: Electric System Operating Data 661,461 series;
      Electricity 285,080; Petroleum 53,464; International 23,668; Annual Energy
      Outlook 2018 89,505; SEDS 9,246. Refreshed twice daily at 5 a.m. and 3 p.m.
      Eastern.
    - Access is licence-free in practice. The Terms of Service require attribution
      to "EIA" or "U.S. Energy Information Administration", forbid implying
      endorsement and misusing the trademarked logo, and reserve a right to
      rate-limit — but there is no signed data licence, no fee, and no eligibility
      test.
  consumerVsMarketDataSplit: |
    Total and structural, and it runs the opposite way from the utilities in this
    sector. Market and system data: open, contracted with a real OpenAPI, bulk
    downloadable with no credential at all, and refreshed twice daily. Consumer data:
    does not exist and cannot exist within EIA's statutory reach.

    Read alongside the rest of this series, EIA is the benchmark that makes the
    American Green Button story legible. The country's energy statistics are among
    the most openly published in the world at the aggregate level, while the
    individual customer's own usage data — the thing Green Button was written to
    liberate — remains locked behind whichever utility happens to serve that address,
    with nothing federal compelling its release. Open at the top, closed at the
    bottom.
  dataStandard: |
    No energy data standard is implemented. There is no Green Button / ESPI, no
    NAESB REQ Book 21, no IEC CIM 61968/61970, no IEEE 2030.5, no OpenADR, and no
    OCPP/OCPI anywhere in the surface. What EIA does implement is:
    - OpenAPI 3.0.0 as the machine-readable API contract (the published swagger zip).
    - A proprietary EIA route / frequency / facet / data shape — datasets addressed
      as tree routes, with facets as filter dimensions and named data columns each
      carrying an alias and units.
    - Project Open Data style catalog metadata on the bulk manifest (identifier,
      title, description, keyword, publisher, person, mbox, accessLevel, accessURL),
      matching the DOE data.json catalog at https://www.energy.gov/data.json.
    - EIA's own survey form taxonomy (EIA-860, EIA-861, EIA-923, EIA-176, EIA-914,
      EIA-930) as the de facto data model behind every route.
  accessGate: self-serve
  accessGateSteps: |
    APIv2: (1) go to https://www.eia.gov/opendata/register.php; (2) complete the form
    — First Name, Last Name, Email, a category describing you or your organization
    (Business/Industry, Private citizen, Research/Consulting, Finance, Government,
    Student, Teacher/Professor, Media, Trade Association/Nonprofit, Library, Other),
    and an optional reason for use; (3) accept the inline API Terms of Service; (4)
    the key is emailed automatically. There is no human review, no accreditation, no
    organizational eligibility test, no licence to sign, and no fee. EIA's own
    wording: "Your API key will be sent to your email address as well as any required
    API notifications."

    Bulk Download Facility: NO gate at all. EIA states plainly that "An API key is
    not required to use the bulk download facility", and this was verified —
    https://api.eia.gov/bulk/manifest.txt and https://api.eia.gov/bulk/ELEC.zip both
    returned HTTP 200 anonymously.
  authModel: |
    API key only, passed as the api_key query parameter. The published OpenAPI
    declares exactly one scheme:
    components.securitySchemes.api_key: {type: apiKey, name: api_key, in: query},
    applied globally via security: [{api_key: []}]. EIA's technical documentation is
    explicit that the key must be in the URL and "will not be detected in the HTTP
    headers", even though other query parameters may be sent as headers. There is no
    OAuth2, no OpenID Connect, no mTLS, no bearer token, no client certificate, and
    no accreditation regime of any kind. The bulk facility is unauthenticated.

    Rate limiting is real but under-documented. The technical documentation warns
    that recursive scrapers "must throttle the number of the requests they make per
    second and per hour", that an exceeding key "will be automatically but
    temporarily suspended", and that "More specific information about these throttles
    are documented on our Open Data web pages" — but no numeric throttle was found on
    https://www.eia.gov/opendata/ (searched for "throttle", "rate limit", "requests
    per"; zero matches). The only published hard limit is the 5,000-row cap per JSON
    response, surfaced in-payload as a warning: "The API can only return 5000 rows in
    JSON format. Please consider constraining your request with facet, start, or end,
    or using offset to paginate results."
