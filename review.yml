actions:
  openapiHarvested: true
  specsCount: 1
  apisYmlCreated: true
  reason: |
    EIA has a real, free, self-serve, well-documented public API with a genuine
    downloadable OpenAPI 3.0.0 contract, plus an entirely ungated bulk download
    facility. Both were probed live and the spec was harvested verbatim and
    validated. No consumer energy data surface exists at EIA, no Green Button
    reference exists anywhere on eia.gov, and nothing was invented to fill the gap.
