notFound:
- Green Button / ESPI endpoint, reference, or mention of any kind
- Consumer or customer-level usage or billing API
- OAuth2, OpenID Connect, or any consent/authorization flow
- OIDC discovery document on either www.eia.gov or api.eia.gov
- GraphQL endpoint
- AsyncAPI, webhooks, streaming, or event notification API
- MCP server
- llms.txt
- apis.json or .well-known/api-catalog
- Agency-level data.json (EIA's catalog entries live in DOE's file)
- Published numeric rate limits (only the 5,000-row response cap is documented)
- SDKs or client libraries published by EIA (the Excel add-in is the only client)
- Status page for the API
- Postman collection published by EIA
- security.txt or a vulnerability disclosure policy on eia.gov
