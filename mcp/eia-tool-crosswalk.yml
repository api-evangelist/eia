summary: |
  Binds every published community MCP tool over EIA APIv2 to the OpenAPI operation(s) that
  actually back it, so each tool inherits a real input contract from the spec instead of a
  guessed one. EIA publishes no first-party MCP server, so both tool sets here are community
  (see mcp/eia-mcp.yml). The OpenAPI has essentially no operationIds - only 6 of 278
  operations carry one, and the single meaningful value is a PHP controller FQCN
  (EIA\API\Controllers\Dataset\AeoIeo\IeoController::post_data) - so operations are bound by
  METHOD + PATH, which is the only stable identifier the spec offers. That absence is itself
  the headline governance finding for this API.
