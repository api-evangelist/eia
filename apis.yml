aid: eia
url: https://raw.githubusercontent.com/api-evangelist/eia/refs/heads/main/apis.yml
name: EIA
kind: company
description: The U.S. Energy Information Administration (EIA) is the independent statistical and
  analytical agency within the U.S. Department of Energy, created by the Department of Energy Organization
  Act of 1977, that collects, analyzes, and disseminates energy information for the United States.
  EIA sits at the measurement layer of the American energy value chain rather than the operating
  layer - it does not generate, transmit, distribute, or retail energy, and it does not regulate
  anyone. Instead it compels the industry to report through mandatory survey forms (EIA-860, EIA-861,
  EIA-923, EIA-176, EIA-914, EIA-930 and dozens more) and then publishes the result as the reference
  statistics for electricity, natural gas, petroleum, coal, nuclear, renewables, emissions, and international
  energy. EIA's API posture is the strongest of any organization in this sector and a genuine benchmark
  for government data anywhere. The Open Data APIv2 at api.eia.gov/v2 is a fully RESTful, self-documenting,
  hierarchically routed API covering more than two million time series, described by a real downloadable
  OpenAPI 3.0.0 contract carrying 225 paths and 278 operations, opened by a free API key that is
  emailed automatically from a public registration form with no review, no accreditation, and no
  licence to sign. A companion bulk download facility at api.eia.gov/bulk serves the same data as
  manifest-indexed zip archives and requires no key at all. The split that defines this sector is
  absolute here. EIA's market, system, and grid data is wide open - hourly balancing-authority demand
  and interchange, wholesale and spot prices, generator-level capacity and operations - while EIA
  publishes no consumer energy data API of any kind. There is no Green Button, no ESPI, no Download
  My Data, no Connect My Data, no consent flow, and no customer usage or billing endpoint, because
  individual customer data is never collected by EIA in the first place; its surveys arrive already
  aggregated from utilities and are further protected by statutory confidentiality. EIA is therefore
  the clearest instance of the recurring finding in this series - a federal data agency that publishes
  a far better documented, far more accessible API than the regulated utilities whose numbers it
  reports.
