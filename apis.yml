apis:
- aid: eia:eia-bulk-download-facility
  name: EIA Bulk Download Facility
  description: >-
    EIA's bulk data distribution surface, served from the same api.eia.gov host as APIv2 but requiring
    no API key whatsoever. A single manifest at /bulk/manifest.txt returns a JSON catalog of every bulk
    dataset with Project Open Data style metadata - identifier, title, description, keyword, publisher,
    person, mbox, accessLevel, accessURL, and last_updated - and each dataset is then downloadable as
    a zip archive of newline-delimited JSON, for example /bulk/ELEC.zip. Datasets include U.S. Electric
    System Operating Data (661,461 series), Electricity (285,080), Petroleum (53,464), Annual Energy Outlook
    releases back to 2014, International, SEDS, STEO, Coal, Natural Gas, CO2 Emissions, Crude Oil Imports,
    Nuclear Outages, and Total Energy. Updated twice daily at 5 a.m. and 3 p.m. Eastern. Verified live
    2026-07-27 - GET /bulk/manifest.txt returned HTTP 200 anonymously and GET /bulk/ELEC.zip returned
    HTTP 200 with a 291,920,911-byte zip payload, both without a key.
  humanURL: https://www.eia.gov/opendata/bulkfiles.php
  baseURL: https://www.eia.gov/opendata/bulk
  tags:
  - Open Data
  - Bulk Data
  - Energy Statistics
  - Electricity
  - Time Series
