openapi: 3.2.0
info:
  title: EIA APIv2 ELEC API
  description: Swagger UI interface for EIA's APIv2. You can also explore EIA's API using the Opendata Query Browser. For this UI, you must use your EIA `api key` to apply filters and return data. You can register for an API Key at https://www.eia.gov/opendata/
  version: 2.1.0
servers:
- url: https://api.eia.gov
security:
- api_key: []
tags:
- name: ELEC
  description: Access to Electricity Data
paths:
  /v2/electricity/facility-fuel/facet/{facet_id}:
    parameters:
    - $ref: '#/components/parameters/facetId'
    get:
      tags:
      - ELEC
      responses:
        '400':
          description: Invalid input
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/responses/facet'
      summary: Get electricity facility fuel facet by facet id
      x-summary-source: derived
      operationId: getV2ElectricityFacilityFuelFacetByFacetId
