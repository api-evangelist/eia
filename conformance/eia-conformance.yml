source: openapi/eia-api-v2-openapi.yml, https://www.eia.gov/opendata/documentation.php,
  https://www.energy.gov/data.json
summary: |
  EIA APIv2 conforms to OpenAPI 3.0 and to the U.S. federal open-data regime it exists to
  discharge, but to essentially none of the cross-cutting HTTP/API conventions that scoring
  usually looks for - no OAuth, no OIDC, no RFC 9457 problem details, no RFC 8594 sunset
  headers, no JSON:API, no OData, no cursor pagination, no idempotency. Its transport-layer
  and domain conformance is strong; its API-convention conformance is thin. Entries marked
  derived come from the spec; entries marked searched come from EIA/DOE published pages.
standards:
- id: openapi-3.0
  conforms: true
  evidence: openapi/eia-api-v2-openapi.yml declares openapi 3.0.0 with 225 paths, 278
    operations, 16 tags and 18 component schemas; published by EIA as
    https://www.eia.gov/opendata/eia-api-swagger.zip
  method: searched
- id: openapi-3.1
  conforms: false
- id: rest
  conforms: true
  evidence: Resource-oriented hierarchical routes, GET for reads, self-describing metadata at
    every node; EIA describes it as "a fully RESTful implementation".
  method: searched
- id: api-key-auth
  conforms: true
  evidence: components.securitySchemes.api_key - type apiKey, in query, name api_key; applied
    globally via the root security requirement.
  method: derived
- id: oauth2
  conforms: false
  evidence: No oauth2 security scheme in the spec and no OAuth documentation; probes of
    /.well-known/oauth-authorization-server returned no document.
- id: oidc
  conforms: false
- id: rfc9457-problem-details
  conforms: false
  evidence: Errors are returned as {"error":{"code","message"}} or {"error","code"}; no
    application/problem+json media type appears anywhere in the spec.
  method: derived
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 404 on www.eia.gov and the API-key gate on
    api.eia.gov.
  method: derived
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation header is documented; APIv1 deprecation was communicated
    in prose only.
- id: json
  conforms: true
  evidence: Default response media type is application/json on every operation.
  method: derived
- id: xml
