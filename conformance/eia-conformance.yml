certifications_note: EIA is a federal statistical agency and publishes no commercial security
  certifications (no SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP attestation is published for
  the Open Data API), and operates no trust center. Its assurance posture is federal policy
  compliance, recorded above.
