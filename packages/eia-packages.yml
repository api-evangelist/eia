source: https://pypi.org/, https://www.npmjs.com/, https://cran.r-project.org/, https://github.com/EIAgov
summary: |
  EIA publishes NO first-party client library on any public package registry. Its GitHub
  presence (https://github.com/EIAgov) is a user account with four public repositories -
  NEMS (Fortran), BlueSky (Python), dash-benchmark (Python), and the EIAgov profile repo -
  none of which is an API client. The first-party clients EIA does ship are not registry
  packages: the EIA & FRED Excel Data Add-In (eia.xlam, v2.1.0, released 2023-03-30) and a
  Google Sheets add-on that EIA's own page currently lists as suspended. Those are catalogued
  in components/eia-components.yml. Everything below is COMMUNITY-maintained and marked
  official: false - verified live on the registry on 2026-07-27.
packages:
