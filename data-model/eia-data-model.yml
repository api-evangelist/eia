    description: "Tree root listing the top-level families"
operation_shapes:
  note: Three shapes repeat across all 225 paths - this is why the API is walkable with four
    generic tools (see mcp/eia-tool-crosswalk.yml).
  shapes:
  - pattern: "GET <route>"
    returns: Route or FinalRoute metadata
  - pattern: "GET <route>/facet and GET <route>/facet/{facet_id}"
    returns: FacetDetails / FacetOptionList
  - pattern: "GET|POST <route>/data"
    returns: DataResponse
